<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bellairs Workshop Photos</title>
    <meta name="description" content="Photos from past Bellairs Workshops at the Bellairs Research Institute of McGill University in Holetown, Barbados.">
    <link rel="icon" href="img/favicon.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #222; }
        header { max-width: 1200px; margin: 0 auto; padding: 28px 16px 12px; }
        h1 { font-size: 1.6rem; margin: 0 0 6px; }
        header p { margin: 0; color: #666; }
        header a { color: #6f42c1; }
        .grid { max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px; columns: 4 220px; column-gap: 8px; }
        .grid img { width: 100%; display: block; margin-bottom: 8px; border-radius: 4px; cursor: zoom-in; background: #eee; }
        .viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); display: none; align-items: center; justify-content: center; z-index: 10; }
        .viewer.open { display: flex; }
        .viewer img { max-width: 92vw; max-height: 86vh; object-fit: contain; }
        .viewer button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.4rem; cursor: pointer; padding: 16px; opacity: .8; }
        .viewer button:hover { opacity: 1; }
        .prev { left: 0; top: 50%; transform: translateY(-50%); }
        .next { right: 0; top: 50%; transform: translateY(-50%); }
        .close { top: 0; right: 0; }
        .caption { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #ccc; font-size: .9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Bellairs Workshop photos</h1>
        <p>Photos from the 2022, 2023 and 2025 workshops at the
            <a href="https://www.mcgill.ca/bellairs/" target="_blank">Bellairs Research Institute</a> (McGill University),
            Holetown, Barbados. Click any photo to browse.</p>
    </header>

    <div class="grid" id="grid"></div>

    <div class="viewer" id="viewer">
        <button class="close" onclick="closeViewer()" aria-label="Close">&times;</button>
        <button class="prev" onclick="step(-1)" aria-label="Previous photo">&#10094;</button>
        <img id="big" src="" alt="">
        <button class="next" onclick="step(1)" aria-label="Next photo">&#10095;</button>
        <div class="caption" id="caption"></div>
    </div>

    <script>
        var PHOTOS = ["2022_1.jpg", "2022_10.jpg", "2022_11.jpg", "2022_12.jpg", "2022_13.jpg", "2022_14.jpg", "2022_15.jpg", "2022_18.jpg", "2022_2.jpg", "2022_20.jpg", "2022_25.jpg", "2022_27.jpg", "2022_28.jpg", "2022_31.jpg", "2022_32.jpg", "2022_35.jpg", "2022_36.jpg", "2022_37.jpg", "2022_38.jpg", "2022_39.jpg", "2022_41.jpg", "2022_42.jpg", "2022_43.jpg", "2022_45.jpg", "2022_47.jpg", "2022_48.jpg", "2022_49.jpg", "2022_5.jpg", "2022_50.jpg", "2022_52.jpg", "2022_53.jpg", "2022_54.jpg", "2022_55.jpg", "2022_57.jpg", "2022_58.jpg", "2022_59.jpg", "2022_6.jpg", "2022_60.jpg", "2022_61.jpg", "2022_62.jpg", "2022_63.jpg", "2022_64.jpg", "2022_65.jpg", "2022_66.jpg", "2022_67.jpg", "2022_68.jpg", "2022_69.jpg", "2022_7.jpg", "2022_70.jpg", "2022_71.jpg", "2022_72.jpg", "2022_73.jpg", "2022_74.jpg", "2022_75.jpg", "2022_76.jpg", "2022_77.jpg", "2022_78.jpg", "2022_79.jpg", "2022_8.jpg", "2022_80.jpg", "2022_81.jpg", "2022_82.jpg", "2022_83.jpg", "2022_84.jpg", "2022_85.jpg", "2022_86.jpg", "2023_1.jpg", "2023_10.jpg", "2023_11.jpg", "2023_12.jpg", "2023_13.jpg", "2023_14.jpg", "2023_15.jpg", "2023_16.jpg", "2023_17.jpg", "2023_18.jpg", "2023_19.jpg", "2023_2.jpg", "2023_20.jpg", "2023_21.jpg", "2023_22.jpg", "2023_23.jpg", "2023_24.jpg", "2023_25.jpg", "2023_26.jpg", "2023_27.jpg", "2023_28.jpg", "2023_29.jpg", "2023_3.jpg", "2023_30.jpg", "2023_31.jpg", "2023_32.jpg", "2023_33.jpg", "2023_34.jpg", "2023_35.jpg", "2023_36.jpg", "2023_37.jpg", "2023_38.jpg", "2023_39.jpg", "2023_4.jpg", "2023_40.jpg", "2023_41.jpg", "2023_5.jpg", "2023_6.jpg", "2023_7.jpg", "2023_8.jpg", "2023_9.jpg", "2023_group_photo.jpg", "2025_01.jpg", "2025_02.jpg", "2025_03.jpg", "2025_04.jpg", "2025_05.jpg", "2025_06.jpg", "2025_07.jpg", "2025_08.jpg", "2025_09.jpg", "2025_10.jpg", "2025_11.jpg", "2025_12.jpg", "2025_13.jpg", "2025_14.jpg", "2025_15.jpg", "2025_16.jpg", "2025_17.jpg", "2025_18.jpg", "2025_19.jpg", "2025_20.jpg", "2025_21.jpg", "2025_22.jpg", "2025_23.jpg", "2025_24.jpg", "2025_25.jpg", "2025_26.jpg", "2025_27.jpg", "2025_28.jpg", "2025_29.jpg", "2025_30.jpg", "2025_31.jpg", "2025_32.jpg", "2025_33.jpg", "2025_34.jpg", "2025_35.jpg", "2025_36.jpg", "2025_37.jpg", "2025_38.jpg", "2025_39.jpg", "2025_40.jpg", "2025_41.jpg", "2025_42.jpg", "2025_43.jpg"];
        for (var i = PHOTOS.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = PHOTOS[i]; PHOTOS[i] = PHOTOS[j]; PHOTOS[j] = t;
        }

        var grid = document.getElementById('grid');
        var viewer = document.getElementById('viewer');
        var big = document.getElementById('big');
        var caption = document.getElementById('caption');
        var pos = 0;

        PHOTOS.forEach(function (name, i) {
            var img = document.createElement('img');
            img.src = 'gallery/thumbs/' + name;
            img.alt = 'Bellairs Workshop ' + name.slice(0, 4);
            img.loading = 'lazy';
            img.onclick = function () { openViewer(i); };
            grid.appendChild(img);
        });

        function show() {
            var name = PHOTOS[pos];
            big.src = 'gallery/photos/' + name;
            big.alt = 'Bellairs Workshop ' + name.slice(0, 4);
            caption.textContent = 'BCL ' + name.slice(0, 4) + '  ·  ' + (pos + 1) + ' / ' + PHOTOS.length;
            new Image().src = 'gallery/photos/' + PHOTOS[(pos + 1) % PHOTOS.length];
        }
        function openViewer(i) { pos = i; show(); viewer.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function closeViewer() { viewer.classList.remove('open'); document.body.style.overflow = ''; }
        function step(d) { pos = (pos + d + PHOTOS.length) % PHOTOS.length; show(); }

        viewer.addEventListener('click', function (e) { if (e.target === viewer) closeViewer(); });
        document.addEventListener('keydown', function (e) {
            if (!viewer.classList.contains('open')) return;
            if (e.key === 'Escape') closeViewer();
            if (e.key === 'ArrowLeft') step(-1);
            if (e.key === 'ArrowRight') step(1);
        });
        var touchX = null;
        viewer.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
        viewer.addEventListener('touchend', function (e) {
            if (touchX === null) return;
            var dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
            touchX = null;
        });
    </script>
</body>
</html>
